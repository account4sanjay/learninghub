server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # hashed build output: cache for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # the page itself must always be re-fetched, otherwise a browser keeps pointing at an old bundle after a rebuild
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
