server:
  port: 8090

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
        - id: schedule-service
          uri: lb://schedule-service
          predicates:
            - Path=/api/schedule/**
        - id: enrollment-service
          uri: lb://enrollment-service
          predicates:
            - Path=/api/enrollment/**
        - id: learning-service
          uri: lb://learning-service
          predicates:
            - Path=/api/learning/**
        - id: assessment-service
          uri: lb://assessment-service
          predicates:
            - Path=/api/assessment/**
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**
        - id: dashboard-service
          uri: lb://dashboard-service
          predicates:
            - Path=/api/dashboard/**
        # keycloak under the legacy /auth prefix (KC_HTTP_RELATIVE_PATH=/auth);
        # X-Forwarded-Host/Proto are added by the gateway so Keycloak generates
        # externally reachable redirect/form URLs
        - id: keycloak
          uri: ${KEYCLOAK_URL:http://localhost:8180}
          predicates:
            - Path=/auth/**
        # everything else is the Svelte SPA (static files served by the
        # frontend container) — lowest-precedence catch-all
        - id: frontend
          uri: ${FRONTEND_URL:http://localhost:5173}
          predicates:
            - Path=/**

eureka:
  client:
    service-url:
      # host-run default; docker-compose overrides via EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
